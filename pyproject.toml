[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "i-op"
version = "0.1.0"
description = "Voice command recognition practice project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "soundfile>=0.12",
    "torch>=2.3",
    "sounddevice>=0.5",
    "pyyaml>=6.0",
]

[project.scripts]
iop-prepare = "iop.scripts.prepare_data:main"
iop-train = "iop.scripts.train:main"
iop-evaluate = "iop.scripts.evaluate:main"
iop-mic = "iop.scripts.demo_mic:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]